[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.lints.clippy]
pedantic = "warn"
all = "warn"


[workspace.dependencies]
rand = "0.10.1"
sha2 = "0.11.0"
bip39 = { path = "crates/bip39" }
derivation_paths = {path = "crates/derivation_paths"}
hex = "0.4.3"
k256 = "0.13.4"
zeroize = "1.9.0"
